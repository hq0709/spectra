# Virtual packages assumed when locking (conda-lock --virtual-package-spec).
# Chosen as the oldest machine the env must run on: RHEL/EL8 the development cluster nodes,
# glibc 2.28, kernel 4.18. No __cuda entry: the conda layer is CPU-only in
# both envs (the GPU env takes CUDA from pip wheels), so the solver must not
# pick CUDA variants of conda packages such as libarrow.
subdirs:
  linux-64:
    packages:
      __unix: "0"
      __linux: "4.18"
      __glibc: "2.28"
      __archspec: "1 x86_64"
